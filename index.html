<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europe Snow Depth</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: #dfe7ee; }
  .panel {
    background: rgba(255,255,255,0.94); padding: 10px 12px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 13px; line-height: 1.35; color: #1d2731;
  }
  .panel h1 { font-size: 15px; margin: 0 0 4px; }
  .panel .muted { color: #5a6773; font-size: 12px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend-swatch { width: 18px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.15); }
  .snow-overlay { image-rendering: auto; }
  #status.error { color: #b3261e; }
  .panel select { font: inherit; margin-top: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  // ---- Config -------------------------------------------------------------
  const API = 'https://api.open-meteo.com/v1/dwd-icon'; // DWD ICON (ICON-EU ~7 km over Europe)
  const EUROPE = { south: 34, north: 72, west: -25, east: 45 };
  const BATCH = 100;          // locations per API request
  const CONCURRENCY = 3;      // parallel requests
  const MAX_POINTS = 500;     // cap per view (free API allows ~600 locations/min); grid coarsens to fit

  // Snow depth colour scale (metres -> colour)
  const SCALE = [
    [0.01, '#d6f0ff', '1–5 cm'],
    [0.05, '#9fd3f5', '5–10 cm'],
    [0.10, '#5fa8e8', '10–20 cm'],
    [0.20, '#3a6fd1', '20–50 cm'],
    [0.50, '#5b3fb8', '50–100 cm'],
    [1.00, '#8e2aa6', '1–2 m'],
    [2.00, '#c21f7a', '> 2 m'],
  ];
  
  // ---- Map ----------------------------------------------------------------
  const map = L.map('map', {
    center: [52, 12], zoom: 4, minZoom: 3, maxZoom: 11,
    maxBounds: [[EUROPE.south - 8, EUROPE.west - 15], [EUROPE.north + 8, EUROPE.east + 15]],
    preferCanvas: true,
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO | Weather data: <a href="https://open-meteo.com/">Open-Meteo</a> (DWD ICON)',
    subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);

  // Labels on top of the snow layer so place names stay readable
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 650;
  map.getPane('labels').style.pointerEvents = 'none';
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', pane: 'labels', maxZoom: 19,
  }).addTo(map);

  // ---- Info / legend panel -------------------------------------------------
  const info = L.control({ position: 'topright' });
  info.onAdd = () => {
    const div = L.DomUtil.create('div', 'panel');
    div.innerHTML = `
      <h1>Current snow depth</h1>
      <div class="muted" id="updated">Model: DWD ICON via Open-Meteo</div>
      <div style="margin-top:6px">${SCALE.slice().reverse().map(([, c, label]) =>
        `<div class="legend-row"><span class="legend-swatch" style="background:${c}"></span>${label}</div>`).join('')}
      </div>
      <label class="muted">Opacity
        <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.7" style="width:90px;vertical-align:middle">
      </label>
      <div class="muted" id="status" style="margin-top:6px">Loading…</div>
      <div class="muted" style="margin-top:4px">Zoom in for finer detail. Click for a point reading.</div>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  info.addTo(map);
  const statusEl = document.getElementById('status');
  const updatedEl = document.getElementById('updated');
  const setStatus = (msg, isError = false) => {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
  };

  let opacity = 0.7;
  document.getElementById('opacity').addEventListener('input', e => {
    opacity = +e.target.value;
    if (overlay) overlay.setOpacity(opacity);
  });

  // ---- Grid & data ---------------------------------------------------------
  const STEPS = [3, 2.5, 2, 1.5, 1, 0.5, 0.25, 0.125, 0.0625];
  const stepForZoom = z => z <= 3 ? 2.5 : z === 4 ? 1 : z === 5 ? 0.5 : z === 6 ? 0.25 : z === 7 ? 0.125 : 0.0625;

  // Cache of readings, kept per model hour (also persisted in localStorage so
  // reloads/pans don't burn through the free API quota).
  const hourTag = () => new Date().toISOString().slice(0, 13);
  const STORE = 'snowmap-cache-v1';
  let cacheHour = hourTag();
  let cache = new Map(); // key -> {depth, temp} | null
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.hour === cacheHour) cache = new Map(saved.entries);
  } catch {}
  let saveTimer;
  const persist = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE, JSON.stringify({ hour: cacheHour, entries: [...cache] })); } catch {}
    }, 1000);
  };
  const key = (step, lat, lon) => `${step}|${lat}|${lon}`;

  function gridFor(bounds, step) {
    const s = Math.max(bounds.getSouth(), EUROPE.south);
    const n = Math.min(bounds.getNorth(), EUROPE.north);
    const w = Math.max(bounds.getWest(), EUROPE.west);
    const e = Math.min(bounds.getEast(), EUROPE.east);
    if (s >= n || w >= e) return null;
    const lats = [], lons = [];
    for (let lat = Math.floor(s / step) * step + step / 2; lat < n + step / 2; lat += step) lats.push(+lat.toFixed(5));
    for (let lon = Math.floor(w / step) * step + step / 2; lon < e + step / 2; lon += step) lons.push(+lon.toFixed(5));
    return { step, lats, lons, size: lats.length * lons.length };
  }

  async function fetchBatch(points) {
    const url = `${API}?latitude=${points.map(p => p[0]).join(',')}` +
      `&longitude=${points.map(p => p[1]).join(',')}` +
      `&current=snow_depth,temperature_2m&timezone=GMT`;
    const res = await fetch(url);
    if (!res.ok) {
      let reason = `HTTP ${res.status}`;
      try { reason = (await res.json()).reason || reason; } catch {}
      throw new Error(reason);
    }
    const json = await res.json();
    return Array.isArray(json) ? json : [json];
  }

  // ---- Rendering: bilinear interpolation into a Web-Mercator image ---------
  const SCALE_RGB = SCALE.map(([min, hex]) => [min, parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]);
  const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  const invMercY = y => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
  let overlay = null;

  function render(grid) {
    const { step, lats, lons } = grid;
    const R = lats.length, C = lons.length;
    const vals = new Float32Array(R * C).fill(NaN);
    for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) {
      const v = cache.get(key(step, lats[i], lons[j]));
      if (v && v.depth != null) vals[i * C + j] = v.depth;
    }
    const south = lats[0] - step / 2, north = lats[R - 1] + step / 2;
    const west = lons[0] - step / 2, east = lons[C - 1] + step / 2;
    const yS = mercY(south), yN = mercY(north);
    const W = Math.min(1200, C * 12);
    const H = Math.max(1, Math.round(W * (yN - yS) / ((east - west) * Math.PI / 180)));
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(W, H);
    const px = img.data;
    for (let y = 0; y < H; y++) {
      const lat = invMercY(yN - (y + 0.5) / H * (yN - yS));
      let fi = (lat - lats[0]) / step; fi = Math.max(0, Math.min(R - 1, fi));
      const i0 = Math.floor(fi), i1 = Math.min(R - 1, i0 + 1), ti = fi - i0;
      for (let x = 0; x < W; x++) {
        const lon = west + (x + 0.5) / W * (east - west);
        let fj = (lon - lons[0]) / step; fj = Math.max(0, Math.min(C - 1, fj));
        const j0 = Math.floor(fj), j1 = Math.min(C - 1, j0 + 1), tj = fj - j0;
        // Weighted average over the corners that have data
        let sum = 0, wsum = 0;
        const corners = [[i0, j0, (1 - ti) * (1 - tj)], [i0, j1, (1 - ti) * tj], [i1, j0, ti * (1 - tj)], [i1, j1, ti * tj]];
        for (const [a, b, w] of corners) {
          const v = vals[a * C + b];
          if (!Number.isNaN(v) && w > 0) { sum += v * w; wsum += w; }
        }
        if (wsum < 0.5) continue; // mostly unknown here: leave transparent
        const d = sum / wsum;
        let col = null;
        for (const c of SCALE_RGB) if (d >= c[0]) col = c;
        if (!col) continue;
        const o = (y * W + x) * 4;
        px[o] = col[1]; px[o + 1] = col[2]; px[o + 2] = col[3]; px[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const b = [[south, west], [north, east]];
    if (!overlay) {
      overlay = L.imageOverlay(canvas.toDataURL(), b, { opacity, className: 'snow-overlay' }).addTo(map);
    } else {
      overlay.setUrl(canvas.toDataURL());
      overlay.setBounds(L.latLngBounds(b));
    }
  }

  let generation = 0;
  let lastTime = null;

  async function refresh() {
    const gen = ++generation;
    if (hourTag() !== cacheHour) { cacheHour = hourTag(); cache = new Map(); }
    const bounds = map.getBounds();
    let step = stepForZoom(map.getZoom());
    let grid = gridFor(bounds, step);
    while (grid && grid.size > MAX_POINTS && STEPS.indexOf(step) > 0) {
      step = STEPS[STEPS.indexOf(step) - 1];
      grid = gridFor(bounds, step);
    }
    if (!grid) { if (overlay) overlay.setUrl(''); setStatus('Pan to Europe to see snow depth.'); return; }

    const missing = [];
    for (const lat of grid.lats) for (const lon of grid.lons)
      if (!cache.has(key(step, lat, lon))) missing.push([lat, lon]);
    render(grid);
    const done_ = () => setStatus(`Grid ${step}° · ${grid.size} points`);
    if (!missing.length) { done_(); return; }

    const batches = [];
    for (let i = 0; i < missing.length; i += BATCH) batches.push(missing.slice(i, i + BATCH));
    let done = 0, failed = null;
    setStatus(`Loading ${missing.length} points…`);

    const worker = async () => {
      while (batches.length && gen === generation && !failed) {
        const batch = batches.shift();
        try {
          const results = await fetchBatch(batch);
          results.forEach((r, i) => {
            const [lat, lon] = batch[i];
            const c = r && r.current;
            cache.set(key(step, lat, lon), c ? { depth: c.snow_depth, temp: c.temperature_2m } : null);
            if (c && c.time) lastTime = c.time;
          });
          persist();
          if (gen === generation) render(grid);
        } catch (err) {
          failed = err;
        }
        done += batch.length;
        if (gen === generation && !failed) setStatus(`Loading… ${Math.round(100 * done / missing.length)}%`);
      }
    };
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
    if (gen !== generation) return;
    if (failed) {
      const limited = /limit/i.test(failed.message) || /429/.test(failed.message);
      setStatus(limited
        ? 'Open-Meteo free rate limit reached (≈600 points/min). Wait a minute, then pan or zoom to resume.'
        : `Data request failed: ${failed.message}. Try again shortly.`, true);
    } else done_();
    if (lastTime) updatedEl.textContent = `DWD ICON · valid ${lastTime.replace('T', ' ')} UTC`;
  }

  let timer;
  map.on('moveend', () => { clearTimeout(timer); timer = setTimeout(refresh, 350); });

  // ---- Click for exact point reading ---------------------------------------
  map.on('click', async e => {
    const { lat, lng } = e.latlng;
    const popup = L.popup().setLatLng(e.latlng).setContent('Loading…').openOn(map);
    try {
      const [r] = await fetchBatch([[lat.toFixed(4), lng.toFixed(4)]]);
      const c = r.current;
      const cm = c.snow_depth == null ? 'n/a' : `${Math.round(c.snow_depth * 100)} cm`;
      popup.setContent(
        `<b>Snow depth: ${cm}</b><br>Temperature: ${c.temperature_2m ?? 'n/a'} °C<br>` +
        `<span class="muted">${lat.toFixed(3)}, ${lng.toFixed(3)} · ${r.elevation ?? '?'} m model elevation<br>` +
        `${c.time.replace('T', ' ')} UTC</span>`);
    } catch (err) {
      popup.setContent(`Could not load point: ${err.message}`);
    }
  });

  refresh();
})();
</script>
</body>
</html>
